services:
  - type: web
    name: lubis-api
    runtime: python
    rootDir: apps/api
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    domains:
      - api.lubis.org
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_NAME
        value: Lubis API
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lubis-postgres
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://lubis.org,https://www.lubis.org,https://clothing.lubis.org,https://realestate.lubis.org,https://mentalawareness.lubis.org
      - key: NOTIFICATION_EMAIL
        value: hello@lubis.org
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: hello@lubis.org
      - key: SMTP_FROM_NAME
        value: Lubis Website
      - key: SMTP_USE_TLS
        value: "true"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        value: https://clothing.lubis.org/order-confirmation
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: IMGBB_API_KEY
        sync: false

databases:
  - name: lubis-postgres
    plan: free
    region: oregon
    databaseName: lubis
    user: lubis
    postgresMajorVersion: "17"
